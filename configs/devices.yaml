# VOS Network Device Inventory
# All credentials use the universal password defined in environment variable NETWORK_PASSWORD
# or can be overridden per-device

defaults:
  password_env: "NETWORK_PASSWORD"
  timeout: 30
  retries: 3
  retry_delay: 2

devices:
  # brocade-core removed 2026-03-XX — FCX624-E decommissioned (failing fans, 71°C ASIC)

  zyxel-frontend:
    type: zyxel
    name: "Zyxel GS1900-24HP Frontend PoE"
    host: 192.168.254.3
    protocol: https
    port: 443
    username: admin
    timeout: 30

  zyxel-cli:
    type: zyxel-cli
    name: "Zyxel GS1900-24HP Frontend PoE (CLI)"
    host: 192.168.254.3
    protocol: ssh
    port: 22
    username: admin
    timeout: 30

  onti-backend:
    type: openwrt
    name: "ONTI-1 S508CL-8S Backend 10G"
    host: 192.168.254.4
    protocol: ssh
    port: 22
    username: root
    timeout: 30

  onti-frontend:
    type: openwrt
    name: "ONTI-2 S508CL-8S Frontend 10G"
    host: 192.168.254.5
    protocol: ssh
    port: 22
    username: root
    timeout: 30

  91tsm:
    type: jtcom
    name: "ONT-S207CW-91TSM Frontend Copper Breakout"
    host: 192.168.254.6
    protocol: http
    port: 80
    username: admin
    password: admin
    timeout: 15

  62tsse:
    type: jtcom
    name: "ONT-S207CW-62TS-SE Lower Cabinet"
    host: 192.168.254.7
    protocol: http
    port: 80
    username: admin
    password: admin
    timeout: 15

  jtcom-lab:
    type: jtcom
    name: "JT-COM S207CW-91TS 2.5G Switch"
    host: 192.168.2.1
    protocol: http
    port: 80
    username: admin
    password: admin
    timeout: 15
    config_paths:
      serial_port: "/dev/ttyUSB0"
      serial_baud: "57600"

# Device groups for fleet management
# Use with config_sync_group to apply profiles to multiple devices
groups:
  switches:
    - zyxel-frontend
    - 91tsm
    - 62tsse
  openwrt-devices:
    - onti-backend
    - onti-frontend
  # Example for access points (add your APs here):
  # access-points:
  #   - ap-living-room
  #   - ap-bedroom
  #   - ap-office

# SNMP communities for monitoring integration
snmp:
  communities:
    vos-monitor:
      - onti-backend
      - onti-frontend
    public:
      - zyxel-frontend

# Zabbix integration (optional)
zabbix:
  url: "http://192.168.254.240/zabbix"
  api_token_env: "ZABBIX_API_TOKEN"
