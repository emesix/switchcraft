# VOS Network Device Inventory
# All credentials use the universal password defined in environment variable NETWORK_PASSWORD
# or can be overridden per-device

defaults:
  password_env: "NETWORK_PASSWORD"
  timeout: 30
  retries: 3
  retry_delay: 2

devices:
  # brocade-core removed 2026-03-XX — FCX624-E decommissioned (failing fans, 71°C ASIC)

  zyxel-frontend:
    type: zyxel
    name: "Zyxel GS1900-24HP Frontend PoE"
    host: 192.168.254.3
    protocol: https
    port: 443
    username: admin
    timeout: 30

  zyxel-cli:
    type: zyxel-cli
    name: "Zyxel GS1900-24HP Frontend PoE (CLI)"
    host: 192.168.254.3
    protocol: ssh
    port: 22
    username: admin
    timeout: 30

  onti-backend:
    type: onti-ogf
    name: "ONTi-BE S508CL-8S Backend 10G"
    host: 192.168.254.30
    protocol: telnet
    port: 23
    username: admin
    password: admin
    timeout: 30

  onti-frontend:
    type: onti-ogf
    name: "ONTi-FE S508CL-8S Frontend 10G"
    host: 192.168.254.31
    protocol: telnet
    port: 23
    username: admin
    password: admin
    timeout: 30

  # Lab/bench unit — stock firmware, same hardware as ONTI S508CL-8S
  # Also sold as: Onti-S508-S8, SKS8300-8, HK-ES3058-8P-L (rebrands)
  # Serial console: 192.168.0.50 (emesix) → /dev/ttyS0 @ 9600 8N1
  # Socat TCP bridge: 192.168.0.50:2323 (for when not on 254.x subnet)
  onti-bench:
    type: onti-ogf
    name: "ONTI S508CL-8S Bench (Stock FW)"
    host: 192.168.0.50
    protocol: telnet
    port: 2323
    username: admin
    timeout: 30

  91tsm:
    type: jtcom
    name: "ONT-S207CW-91TSM Frontend Copper Breakout"
    host: 192.168.254.32
    protocol: http
    port: 80
    username: admin
    password: admin
    timeout: 15

  62tsse:
    type: jtcom
    name: "ONT-S207CW-62TS-SE Lower Cabinet"
    host: 192.168.254.7
    protocol: http
    port: 80
    username: admin
    password: admin
    timeout: 15

  jtcom-lab:
    type: jtcom
    name: "JT-COM S207CW-91TS 2.5G Switch"
    host: 192.168.2.1
    protocol: http
    port: 80
    username: admin
    password: admin
    timeout: 15
    config_paths:
      serial_port: "/dev/ttyUSB0"
      serial_baud: "57600"

# Device groups for fleet management
# Use with config_sync_group to apply profiles to multiple devices
groups:
  switches:
    - zyxel-frontend
    - 91tsm
    - 62tsse
  onti-stock:
    - onti-backend
    - onti-frontend
    - onti-bench
  # Example for access points (add your APs here):
  # access-points:
  #   - ap-living-room
  #   - ap-bedroom
  #   - ap-office

# SNMP communities for monitoring integration
snmp:
  communities:
    vos-monitor:
      - onti-backend
      - onti-frontend
    public:
      - zyxel-frontend

# Zabbix integration (optional)
zabbix:
  url: "http://192.168.254.240/zabbix"
  api_token_env: "ZABBIX_API_TOKEN"
